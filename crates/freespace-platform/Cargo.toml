[package]
name = "freespace-platform"
description = "FreeSpace platform layer; the only crate allowed to call OS APIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["context-menu"]
context-menu = ["dep:winreg"]

[dependencies]
freespace-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
ferrisetw = { workspace = true }
getrandom = { workspace = true }
winreg = { workspace = true, optional = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_RestartManager",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
percent-encoding = { workspace = true }
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
