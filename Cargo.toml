[workspace]
resolver = "3"
members = [
    "apps/freespace-desktop/src-tauri",
    "crates/freespace-analysis",
    "crates/freespace-app",
    "crates/freespace-cli",
    "crates/freespace-core",
    "crates/freespace-ops",
    "crates/freespace-platform",
    "crates/freespace-report",
    "crates/freespace-scan",
    "tests",
]
default-members = ["apps/freespace-desktop/src-tauri", "crates/freespace-cli"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Domain types, persistence and diagnostics
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rust-i18n = "4.2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Persistence, hashing and destructive-operation support
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
md-5 = "0.10"
getrandom = "0.3"

# Scanning, filtering and parallelism
jwalk = "0.9"
rayon = "1.11"
globset = "0.4"
regex = "1.13"

# Snapshots
ciborium = "0.2"
zstd = "0.14"

# Metadata extraction
kamadak-exif = "0.6"
lofty = "0.25"
mp4parse = "0.17"
pelite = "0.10"

# Archive inspection
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
sevenz-rust = "0.6"
tar = "0.4"
flate2 = "1"
iso9660 = "0.1"
unrar = "0.5"

# Report export
csv = "1.4"
quick-xml = "0.42"
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }

# Windows platform layer
windows = "0.62"
winreg = "0.56"
ferrisetw = "1.2"

# Frontends
clap = { version = "4.6", features = ["derive"] }
tauri = { version = "2" }
tauri-build = { version = "2" }

# Test and benchmark support
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

# Workspace crates
freespace-core = { path = "crates/freespace-core" }
freespace-platform = { path = "crates/freespace-platform", default-features = false }
freespace-scan = { path = "crates/freespace-scan" }
freespace-ops = { path = "crates/freespace-ops" }
freespace-analysis = { path = "crates/freespace-analysis" }
freespace-app = { path = "crates/freespace-app" }
freespace-report = { path = "crates/freespace-report" }
freespace-cli = { path = "crates/freespace-cli" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Dependencies are compiled with optimizations even in debug builds: the GUI
# stack is unusably slow otherwise. Workspace crates keep debug info.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
