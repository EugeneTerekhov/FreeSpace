[package]
name = "freespace-desktop"
description = "FreeSpace desktop client: Tauri 2 shell around the Rust core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "freespace-gui"
path = "src/main.rs"

# Without `tauri/custom-protocol` the Tauri build script marks the crate as a
# development build, so the window loads `devUrl` (`http://localhost:1420`)
# instead of the assets embedded from `ui/dist`. The Tauri CLI enables the
# feature for its own builds; the wrapper-free `cargo build` in the portable
# scripts must pass it explicitly via `--features freespace-desktop/custom-protocol`.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
freespace-app = { workspace = true }
freespace-core = { workspace = true }
freespace-ops = { workspace = true }
freespace-platform = { workspace = true }
freespace-scan = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
